[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown_ocr_plugin"
version = "1.0.0"
dependencies = [
  "markitdown==0.1.0a1",
  "openai==1.100.0",
  "redis==6.2.0"
]

# IMPORTANT: MarkItDown will look for this entry point to find the plugin.
[project.entry-points."markitdown.plugin"]
markitdown_ocr_plugin = "markitdown_ocr_plugin"

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_ocr_plugin"]