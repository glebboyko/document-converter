openapi: 3.0.3
info:
  title: Document Converter
  version: 0.1.0
servers:
  - url: https://document-converter.api.lafresa.org
components:
  schemas:
    TokenUsage:
      type: object
      properties:
        input:
          type: integer
          description: Number of input tokens used
          example: 1200
        output:
          type: integer
          description: Number of output tokens used
          example: 800
    ConvertToMarkdownRequest:
      type: object
      required:
        - content
        - extension
      properties:
        content:
          type: string
          description: Base64 encoded file contents
        extension:
          type: string
          description: File extension (e.g., pdf, docx)
        llm_model_ocr:
          type: string
          nullable: true
          description: (Optional) LLM model to use for OCR
        llm_model_image:
          type: string
          nullable: true
          description: (Optional) LLM model to use for image interpretation
    ConvertToMarkdownResponse:
      type: object
      properties:
        md:
          type: string
          description: Converted markdown result
        llm_model_ocr:
          type: string
          description: LLM model used for OCR
        llm_model_image:
          type: string
          description: LLM model used for image interpretation
        token_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TokenUsage'
          description: Dictionary mapping LLM model name to its token usage
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message
    OcrDocumentBase64:
      type: object
      required:
        - type
        - document_base64
        - document_name
      properties:
        type:
          type: string
          enum: [document_base64]
        document_base64:
          type: string
          description: Base64 encoded file contents
        document_name:
          type: string
          description: Original filename (extension is used to detect format)
    OcrRequest:
      type: object
      required:
        - model
        - document
      properties:
        model:
          type: string
          description: Model identifier echoed back in the response
        document:
          $ref: '#/components/schemas/OcrDocumentBase64'
        id:
          type: string
          nullable: true
        pages:
          type: array
          items:
            type: integer
          nullable: true
        include_image_base64:
          type: boolean
          nullable: true
        image_limit:
          type: integer
          nullable: true
        image_min_size:
          type: integer
          nullable: true
    OcrPage:
      type: object
      properties:
        index:
          type: integer
          example: 0
        markdown:
          type: string
        images:
          type: array
          items: {}
        dimensions:
          type: object
    OcrUsageInfo:
      type: object
      properties:
        pages_processed:
          type: integer
          example: 1
        doc_size_bytes:
          type: integer
    OcrResponse:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/OcrPage'
        model:
          type: string
        usage_info:
          $ref: '#/components/schemas/OcrUsageInfo'
paths:
  /api/v1/convert/to-markdown:
    post:
      tags:
        - Converter
      summary: Convert document to markdown
      operationId: convertToMarkdown
      requestBody:
        description: Base64 encoded document and parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertToMarkdownRequest'
      responses:
        '200':
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertToMarkdownResponse'
        '422':
          description: Unprocessable Entity - Invalid input file or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/ocr:
    post:
      tags:
        - Converter
      summary: Azure Mistral-compatible OCR endpoint
      operationId: ocr
      requestBody:
        description: Mistral OCR-style request with base64 document
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: OCR successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'
        '422':
          description: Unprocessable Entity - Invalid input file or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
